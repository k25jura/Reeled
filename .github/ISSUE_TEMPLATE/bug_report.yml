name: Bug Report
description: Report a reproducible bug or unexpected behavior in Reeled.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! The quickest way is **Send feedback** in the app's sidebar
        (or Settings › About), which fills most of this form for you, diagnostics included.

  - type: input
    id: version
    attributes:
      label: Reeled version
      description: Settings › About shows it (e.g. 1.2.0).
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Library (clips, folders, search)
        - Player
        - Moments
        - Settings
        - Updates
        - Installer / uninstaller
        - Other
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11 (24H2 or newer)
        - Windows 11 (23H2 or older)
        - Windows 10 (22H2)
        - Other / Insider Preview
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Reeled
        2. Click on ...
        3. See error ...
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings › About › Copy debug info (added automatically when you report from the app).
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, a short screen recording, the clip's codec/resolution, or %LOCALAPPDATA%\Reeled\Logs\reeled.log.
    validations:
      required: false
