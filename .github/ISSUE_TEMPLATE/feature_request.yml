name: Feature Request
description: Suggest an idea or feature improvement for Reeled.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea or feature that would improve your workflow with game clips? Let us know below!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or missing functionality is.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've evaluated.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any mockups, screenshots, or references.
