name: Feature Request
description: Suggest an idea or improvement for Reeled.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would improve your workflow with game clips? Let us know below.
        You can also use **Send feedback** in the app.

  - type: dropdown
    id: area
    attributes:
      label: Which part of Reeled?
      options:
        - Library (clips, folders, search)
        - Player
        - Moments
        - Settings
        - Updates
        - Something new
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: What would you like Reeled to do?
      description: Describe the feature and how you would use it.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: What is hard or missing today?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, or references from other apps.
    validations:
      required: false
