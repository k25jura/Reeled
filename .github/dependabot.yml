version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      windows-app-sdk:
        patterns:
          - "Microsoft.WindowsAppSDK*"
          - "Microsoft.Windows.SDK.BuildTools*"
      libvlc:
        patterns:
          - "LibVLCSharp*"
          - "VideoLAN.LibVLC*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
