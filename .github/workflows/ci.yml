name: CI Build & Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build Solution (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies (win-x64)
        run: dotnet restore Reeled.sln -r win-x64

      - name: Build Reeled App
        run: dotnet build Reeled/Reeled.csproj -c Release -r win-x64 --no-restore

      - name: Build Reeled Installer
        run: dotnet build Reeled.Installer/Reeled.Installer.csproj -c Release -r win-x64 --no-restore
