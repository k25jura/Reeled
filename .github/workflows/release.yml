name: Build & Release Reeled

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Reeled Setup (Windows x64)
    runs-on: windows-latest
    env:
      # Set these in the repository settings once SignPath has approved the project; without the token the
      # release is built unsigned as before. See docs/code-signing.md.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Extract Tag Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          Write-Host "Detected Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build & Package Custom Installer
        shell: pwsh
        run: |
          $skip = if ($env:SIGNPATH_API_TOKEN) { @{ SkipSelfSigning = $true } } else { @{} }
          .\scripts\build-installer.ps1 -Configuration Release -Version "${{ steps.get_version.outputs.version }}" @skip

      # Code signing (SignPath Foundation, free for open source): the setup, the app and the uninstaller are
      # signed, then the signed app and uninstaller go back into payload.zip before it is hashed and released.
      - name: Collect binaries to sign
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\to-sign | Out-Null
          Copy-Item artifacts\ReeledSetup.exe, artifacts\publish\Reeled.exe, artifacts\publish\Uninstall.exe artifacts\to-sign\

      - name: Upload unsigned binaries
        id: upload-unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: artifacts/to-sign/
          if-no-files-found: error

      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Reeled' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed

      - name: Put signed binaries back and repackage
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          Copy-Item artifacts\signed\Reeled.exe, artifacts\signed\Uninstall.exe artifacts\publish\ -Force
          Copy-Item artifacts\signed\ReeledSetup.exe artifacts\ReeledSetup.exe -Force
          Copy-Item artifacts\signed\ReeledSetup.exe "artifacts\ReeledSetup-v$ver.exe" -Force
          .\scripts\build-installer.ps1 -PackageOnly
          Get-AuthenticodeSignature artifacts\ReeledSetup.exe, artifacts\publish\Reeled.exe, artifacts\publish\Uninstall.exe |
            Format-Table Status, @{ n = 'Signer'; e = { $_.SignerCertificate.Subject } }, Path -AutoSize

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          # "HASH  file" lines; the in-app updater verifies payload.zip against this file
          Get-FileHash -Path artifacts\ReeledSetup.exe, artifacts\payload.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Out-File -FilePath artifacts\checksums.txt -Encoding ascii
          Get-Content artifacts\checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Reeled v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/ReeledSetup.exe
            artifacts/ReeledSetup-v${{ steps.get_version.outputs.version }}.exe
            artifacts/payload.zip
            artifacts/checksums.txt
